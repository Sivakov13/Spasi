<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Go — Platform UI</title>
    <meta name="description" content="Career Go — ATS нового поколения (демо UI)" />
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: #0f172a; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- lucide-react UMD expects window.react -->
    <script>
      window.react = window.React;
    </script>
    <script crossorigin src="https://unpkg.com/lucide-react@0.562.0/dist/umd/lucide-react.min.js"></script>

    <!-- JSX transformer (for demo only) -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState } = React;
      const {
        Search,
        Bell,
        User,
        ChevronRight,
        ChevronLeft,
        Star,
        Clock,
        Users,
        Briefcase,
        BarChart3,
        MessageSquare,
        Settings,
        Plus,
        Filter,
        MoreHorizontal,
        Zap,
        Brain,
        Calendar,
        Mail,
        TrendingUp,
        TrendingDown,
        CheckCircle,
        AlertCircle,
        ArrowRight,
        Sparkles,
        Target,
        Award,
        FileText,
        Send,
        Eye,
        ThumbsUp,
        ThumbsDown,
        X,
        Chrome,
        Upload,
        Globe,
        Video,
        Link,
        Shield,
        Database,
        UserCheck,
        Gift,
        Bot,
        Workflow,
        BookOpen,
        GraduationCap,
        DollarSign,
        Timer,
        MessageCircle,
        ClipboardCheck,
        UserPlus,
        Clipboard,
        Lock,
        Smartphone,
        Home,
        RefreshCw,
        AlertTriangle,
        Check,
        History,
        Trash2,
        Share2,
        TestTube,
        Percent,
        Trophy,
        Medal,
        Rocket,
        Palette,
        UsersRound,
        Inbox,
        Layers,
        Receipt,
        CreditCard,
        Calculator,
        Scale,
        BarChart,
      } = window.LucideReact;

      const CareerGoPlatform = () => {
        const [activeScreen, setActiveScreen] = useState('dashboard');
        const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
        const [selectedCandidate, setSelectedCandidate] = useState(null);

        // ВСЕ экраны платформы
        const screens = {
          main: [
            { id: 'dashboard', label: 'Дашборд', icon: Home },
            { id: 'vacancies', label: 'Вакансии', icon: Briefcase, badge: 12 },
            { id: 'candidates', label: 'Кандидаты', icon: Users, badge: 156 },
            { id: 'talent-pool', label: 'Talent Pool', icon: Database },
            { id: 'career-portal', label: 'Карьерный портал', icon: Globe },
          ],
          communication: [
            { id: 'messages', label: 'Сообщения', icon: MessageSquare, badge: 24 },
            { id: 'calendar', label: 'Календарь', icon: Calendar, badge: 5 },
            { id: 'candidate-portal', label: 'Кабинет кандидата', icon: User },
          ],
          analytics: [
            { id: 'analytics', label: 'Аналитика', icon: BarChart3 },
            { id: 'sla', label: 'SLA и сроки', icon: Timer, badge: 3 },
            { id: 'team-performance', label: 'Команда', icon: Trophy },
            { id: 'budget', label: 'Бюджетирование', icon: DollarSign },
          ],
          tools: [
            { id: 'automation', label: 'Автоматизация', icon: Workflow },
            { id: 'mass-hiring', label: 'Массовый найм', icon: UsersRound },
            { id: 'employer-brand', label: 'HR-бренд', icon: MegaphoneFallback, },
            { id: 'integrations', label: 'Интеграции', icon: Link },
            { id: 'extension', label: 'Расширение', icon: Chrome },
          ],
          admin: [
            { id: 'hiring-manager', label: 'Заказчики', icon: UserCheck, badge: 8 },
            { id: 'onboarding', label: 'Онбординг', icon: Rocket, badge: 4 },
            { id: 'compliance', label: 'Compliance', icon: Shield },
            { id: 'knowledge-base', label: 'База знаний', icon: BookOpen },
            { id: 'settings', label: 'Настройки', icon: Settings },
          ],
        };

        // lucide-react UMD may not include every icon we want in this demo,
        // so we provide a small fallback for rare icons.
        function MegaphoneFallback(props) {
          const size = props && props.size != null ? props.size : 16;
          const style = props && props.style ? props.style : undefined;
          return (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
              <path d="M3 11v2a1 1 0 0 0 1 1h2l5 5V5L6 10H4a1 1 0 0 0-1 1z" />
              <path d="M14 9a3 3 0 0 1 0 6" />
              <path d="M16 7a5 5 0 0 1 0 10" />
            </svg>
          );
        }

        const candidates = [
          { id: 1, name: 'Александр Петров', role: 'Senior Frontend Developer', aiScore: 94, stage: 'Техническое интервью', experience: '7 лет', salary: '350 000 ₽', source: 'hh.ru', lastActivity: '2 часа назад', tags: ['React', 'TypeScript', 'Node.js'], slaStatus: 'ok', daysInStage: 2 },
          { id: 2, name: 'Мария Иванова', role: 'Senior Frontend Developer', aiScore: 88, stage: 'HR интервью', experience: '5 лет', salary: '300 000 ₽', source: 'LinkedIn', lastActivity: '5 часов назад', tags: ['Vue.js', 'JavaScript'], slaStatus: 'warning', daysInStage: 4 },
          { id: 3, name: 'Дмитрий Сидоров', role: 'Product Manager', aiScore: 91, stage: 'Скрининг', experience: '6 лет', salary: '280 000 ₽', source: 'Реферал', lastActivity: '1 день назад', tags: ['Agile', 'Scrum'], slaStatus: 'critical', daysInStage: 6 },
          { id: 4, name: 'Елена Козлова', role: 'UX Designer', aiScore: 85, stage: 'Офер', experience: '4 года', salary: '250 000 ₽', source: 'Карьерный сайт', lastActivity: '3 часа назад', tags: ['Figma', 'UI/UX'], slaStatus: 'ok', daysInStage: 1 },
        ];

        const getScoreColor = (score) => score >= 90 ? '#10b981' : score >= 75 ? '#f59e0b' : '#ef4444';
        const getSLAColor = (status) => status === 'ok' ? '#10b981' : status === 'warning' ? '#f59e0b' : '#ef4444';
        const getInitials = (name) => name.split(' ').map(n => n[0]).join('');

        // Компоненты
        const StatCard = ({ icon: Icon, label, value, change, trend, color = '#6366f1' }) => (
          <div style={{ background: 'rgba(30, 41, 59, 0.6)', backdropFilter: 'blur(10px)', border: '1px solid rgba(148, 163, 184, 0.1)', borderRadius: '16px', padding: '18px' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px' }}>
              <span style={{ color: '#64748b', fontSize: '12px', fontWeight: 500 }}>{label}</span>
              <div style={{ width: '32px', height: '32px', background: `${color}20`, borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon size={16} color={color} />
              </div>
            </div>
            <div style={{ fontSize: '24px', fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", marginBottom: '4px' }}>{value}</div>
            {change && (
              <div style={{ display: 'flex', alignItems: 'center', gap: '4px', color: trend === 'up' ? '#10b981' : '#ef4444', fontSize: '11px', fontWeight: 500 }}>
                {trend === 'up' ? <TrendingUp size={12} /> : <TrendingDown size={12} />} {change}
              </div>
            )}
          </div>
        );

        const Section = ({ title, children, action, badge }) => (
          <div style={{ background: 'rgba(30, 41, 59, 0.6)', backdropFilter: 'blur(10px)', border: '1px solid rgba(148, 163, 184, 0.1)', borderRadius: '16px', padding: '20px', marginBottom: '20px' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: '16px', fontWeight: 600 }}>{title}</h2>
                {badge && <span style={{ background: 'rgba(99, 102, 241, 0.2)', color: '#818cf8', padding: '2px 8px', borderRadius: '10px', fontSize: '11px', fontWeight: 600 }}>{badge}</span>}
              </div>
              {action}
            </div>
            {children}
          </div>
        );

        const FeatureCard = ({ icon: Icon, num, title, description, color = '#6366f1' }) => (
          <div style={{ background: 'rgba(15, 23, 42, 0.6)', border: '1px solid rgba(148, 163, 184, 0.1)', borderRadius: '12px', padding: '14px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px' }}>
              <div style={{ width: '36px', height: '36px', background: `${color}20`, borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon size={18} color={color} />
              </div>
              <span style={{ fontSize: '10px', color: '#64748b', fontWeight: 600 }}>#{num}</span>
            </div>
            <div style={{ fontWeight: 600, fontSize: '13px', marginBottom: '4px' }}>{title}</div>
            <div style={{ fontSize: '11px', color: '#64748b', lineHeight: 1.5 }}>{description}</div>
          </div>
        );

        const Button = ({ children, primary, danger, small, icon: Icon, onClick }) => (
          <button onClick={onClick} style={{
            display: 'flex', alignItems: 'center', gap: '6px',
            background: primary ? 'linear-gradient(135deg, #6366f1, #8b5cf6)' : danger ? 'rgba(239, 68, 68, 0.15)' : 'rgba(30, 41, 59, 0.8)',
            border: danger ? '1px solid rgba(239, 68, 68, 0.3)' : primary ? 'none' : '1px solid rgba(148, 163, 184, 0.2)',
            borderRadius: small ? '6px' : '10px',
            padding: small ? '6px 10px' : '10px 16px',
            color: primary ? '#fff' : danger ? '#ef4444' : '#94a3b8',
            fontSize: small ? '11px' : '13px',
            fontWeight: 600,
            cursor: 'pointer'
          }}>
            {Icon && <Icon size={small ? 14 : 16} />} {children}
          </button>
        );

        return (
          <div style={{ minHeight: '100vh', background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)', fontFamily: "'DM Sans', -apple-system, sans-serif", color: '#e2e8f0', display: 'flex' }}>
            <style>{`
              @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
              * { box-sizing: border-box; margin: 0; padding: 0; }
              ::-webkit-scrollbar { width: 5px; }
              ::-webkit-scrollbar-track { background: transparent; }
              ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
              @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
              @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
              @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
            `}</style>

            {/* Sidebar */}
            <aside style={{
              width: sidebarCollapsed ? '68px' : '240px',
              background: 'rgba(15, 23, 42, 0.95)',
              backdropFilter: 'blur(20px)',
              borderRight: '1px solid rgba(148, 163, 184, 0.1)',
              padding: '16px 10px',
              display: 'flex',
              flexDirection: 'column',
              position: 'fixed',
              height: '100vh',
              transition: 'width 0.3s',
              zIndex: 100,
              overflowY: 'auto'
            }}>
              {/* Logo */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '20px', padding: '0 6px' }}>
                <div style={{ width: '38px', height: '38px', background: 'linear-gradient(135deg, #10b981, #14b8a6)', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <Rocket size={20} color="#fff" />
                </div>
                {!sidebarCollapsed && (
                  <div>
                    <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: '17px', background: 'linear-gradient(135deg, #10b981, #6366f1)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Career Go</div>
                    <div style={{ fontSize: '9px', color: '#64748b' }}>ATS нового поколения</div>
                  </div>
                )}
              </div>

              {/* Navigation */}
              {Object.entries(screens).map(([group, items]) => (
                <div key={group} style={{ marginBottom: '12px' }}>
                  {!sidebarCollapsed && (
                    <div style={{ fontSize: '9px', color: '#475569', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.5px', padding: '6px 10px' }}>
                      {group === 'main' ? 'Основное' : group === 'communication' ? 'Коммуникация' : group === 'analytics' ? 'Аналитика' : group === 'tools' ? 'Инструменты' : 'Управление'}
                    </div>
                  )}
                  {items.map(item => {
                    const Icon = item.icon;
                    const isActive = activeScreen === item.id;
                    return (
                      <button key={item.id} onClick={() => setActiveScreen(item.id)} style={{
                        width: '100%', display: 'flex', alignItems: 'center', gap: '10px',
                        padding: sidebarCollapsed ? '10px' : '9px 10px', marginBottom: '2px',
                        background: isActive ? 'rgba(16, 185, 129, 0.15)' : 'transparent',
                        border: 'none', borderRadius: '8px', cursor: 'pointer',
                        color: isActive ? '#10b981' : '#94a3b8',
                        fontSize: '12px', fontWeight: isActive ? 600 : 500,
                        justifyContent: sidebarCollapsed ? 'center' : 'flex-start'
                      }}>
                        <Icon size={16} />
                        {!sidebarCollapsed && <span style={{ flex: 1, textAlign: 'left' }}>{item.label}</span>}
                        {!sidebarCollapsed && item.badge && (
                          <span style={{ background: isActive ? '#10b981' : 'rgba(148, 163, 184, 0.2)', color: isActive ? '#fff' : '#94a3b8', fontSize: '9px', fontWeight: 600, padding: '2px 5px', borderRadius: '4px' }}>{item.badge}</span>
                        )}
                      </button>
                    );
                  })}
                </div>
              ))}

              <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} style={{ marginTop: 'auto', padding: '8px', background: 'rgba(148, 163, 184, 0.1)', border: 'none', borderRadius: '8px', color: '#64748b', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                {sidebarCollapsed ? <ChevronRight size={16} /> : <ChevronLeft size={16} />}
              </button>
            </aside>

            {/* Main */}
            <main style={{ flex: 1, marginLeft: sidebarCollapsed ? '68px' : '240px', padding: '20px 28px', transition: 'margin-left 0.3s' }}>
              {/* Header */}
              <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '24px' }}>
                <div>
                  <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: '24px', fontWeight: 700, marginBottom: '2px' }}>
                    {activeScreen === 'dashboard' && '📊 Дашборд'}
                    {activeScreen === 'vacancies' && '💼 Вакансии'}
                    {activeScreen === 'candidates' && '👥 Кандидаты'}
                    {activeScreen === 'talent-pool' && '🗄️ Talent Pool'}
                    {activeScreen === 'career-portal' && '🌐 Карьерный портал'}
                    {activeScreen === 'messages' && '💬 Коммуникации'}
                    {activeScreen === 'calendar' && '📅 Календарь интервью'}
                    {activeScreen === 'candidate-portal' && '👤 Личный кабинет кандидата'}
                    {activeScreen === 'analytics' && '📈 Аналитика найма'}
                    {activeScreen === 'sla' && '⏱️ SLA и контроль сроков'}
                    {activeScreen === 'team-performance' && '🏆 Эффективность команды'}
                    {activeScreen === 'budget' && '💰 Бюджетирование'}
                    {activeScreen === 'automation' && '⚙️ Автоматизация'}
                    {activeScreen === 'mass-hiring' && '🏭 Массовый найм'}
                    {activeScreen === 'employer-brand' && '📣 HR-бренд'}
                    {activeScreen === 'integrations' && '🔗 Интеграции'}
                    {activeScreen === 'extension' && '🧩 Браузерное расширение'}
                    {activeScreen === 'hiring-manager' && '👔 Кабинет заказчика'}
                    {activeScreen === 'onboarding' && '🚀 Онбординг и адаптация'}
                    {activeScreen === 'compliance' && '🛡️ Compliance и безопасность'}
                    {activeScreen === 'knowledge-base' && '📚 База знаний и обучение'}
                    {activeScreen === 'settings' && '⚙️ Настройки'}
                  </h1>
                  <p style={{ color: '#64748b', fontSize: '12px' }}>Career Go — 78 фич для эффективного найма</p>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', background: 'rgba(30, 41, 59, 0.8)', padding: '8px 14px', borderRadius: '10px', border: '1px solid rgba(148, 163, 184, 0.1)' }}>
                    <Search size={16} color="#64748b" />
                    <input placeholder="Поиск..." style={{ background: 'transparent', border: 'none', outline: 'none', color: '#e2e8f0', fontSize: '13px', width: '160px' }} />
                  </div>
                  <button style={{ width: '36px', height: '36px', background: 'rgba(30, 41, 59, 0.8)', border: '1px solid rgba(148, 163, 184, 0.1)', borderRadius: '8px', color: '#94a3b8', cursor: 'pointer', position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Bell size={16} />
                    <span style={{ position: 'absolute', top: '6px', right: '6px', width: '6px', height: '6px', background: '#ef4444', borderRadius: '50%' }} />
                  </button>
                  <div style={{ width: '36px', height: '36px', background: 'linear-gradient(135deg, #10b981, #6366f1)', borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 600, fontSize: '12px', cursor: 'pointer' }}>АП</div>
                </div>
              </header>

              {/* ========== DASHBOARD ========== */}
              {activeScreen === 'dashboard' && (
                <div style={{ animation: 'fadeIn 0.3s' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '14px', marginBottom: '20px' }}>
                    <StatCard icon={Users} label="Кандидатов в работе" value="156" change="+12%" trend="up" />
                    <StatCard icon={Briefcase} label="Активных вакансий" value="12" change="+2" trend="up" color="#8b5cf6" />
                    <StatCard icon={Clock} label="Среднее время найма" value="23 дня" change="-4 дня" trend="up" color="#10b981" />
                    <StatCard icon={Award} label="Офферов в месяц" value="8" change="+25%" trend="up" color="#f59e0b" />
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '20px' }}>
                    {/* Воронка */}
                    <Section title="Воронка найма" badge="Фича #25">
                      <div style={{ display: 'flex', alignItems: 'flex-end', gap: '8px', height: '140px' }}>
                        {[
                          { name: 'Новые', count: 156, color: '#6366f1' },
                          { name: 'Скрининг', count: 89, color: '#8b5cf6' },
                          { name: 'HR', count: 45, color: '#a855f7' },
                          { name: 'Тех.', count: 28, color: '#d946ef' },
                          { name: 'Финал', count: 12, color: '#ec4899' },
                          { name: 'Офер', count: 5, color: '#10b981' },
                        ].map((s, i) => (
                          <div key={i} style={{ flex: 1, textAlign: 'center' }}>
                            <div style={{ background: `linear-gradient(180deg, ${s.color}40, ${s.color}20)`, border: `1px solid ${s.color}50`, borderRadius: '6px 6px 0 0', height: `${(s.count / 156) * 120}px`, minHeight: '24px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', fontWeight: 700, color: s.color }}>{s.count}</div>
                            <div style={{ fontSize: '9px', color: '#64748b', marginTop: '6px' }}>{s.name}</div>
                          </div>
                        ))}
                      </div>
                    </Section>

                    {/* Что делать дальше - Фича #09 */}
                    <Section title="Что делать дальше?" badge="Фича #09">
                      {[
                        { icon: AlertCircle, color: '#ef4444', text: '3 кандидата — SLA превышен' },
                        { icon: Calendar, color: '#f59e0b', text: '5 интервью сегодня' },
                        { icon: Star, color: '#10b981', text: 'AI нашёл идеального кандидата' },
                        { icon: MessageSquare, color: '#6366f1', text: '12 непрочитанных сообщений' },
                      ].map((item, i) => {
                        const Icon = item.icon;
                        return (
                          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '10px', background: 'rgba(15, 23, 42, 0.6)', borderRadius: '8px', padding: '10px', marginBottom: '8px' }}>
                            <div style={{ width: '32px', height: '32px', background: `${item.color}20`, borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon size={16} color={item.color} /></div>
                            <span style={{ flex: 1, fontSize: '12px' }}>{item.text}</span>
                            <ChevronRight size={14} color="#64748b" />
                          </div>
                        );
                      })}
                    </Section>
                  </div>

                  {/* Последние кандидаты */}
                  <Section title="Последние кандидаты" action={<Button small icon={ArrowRight}>Все</Button>}>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '12px' }}>
                      {candidates.map(c => (
                        <div key={c.id} onClick={() => setSelectedCandidate(c)} style={{ background: 'rgba(15, 23, 42, 0.6)', border: '1px solid rgba(148, 163, 184, 0.1)', borderRadius: '12px', padding: '14px', cursor: 'pointer' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px' }}>
                            <div style={{ width: '36px', height: '36px', background: 'linear-gradient(135deg, #10b981, #6366f1)', borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 600, fontSize: '12px' }}>{getInitials(c.name)}</div>
                            <div>
                              <div style={{ fontWeight: 600, fontSize: '12px' }}>{c.name}</div>
                              <div style={{ fontSize: '10px', color: '#64748b' }}>{c.role}</div>
                            </div>
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '6px' }}>
                            <span style={{ fontSize: '10px', color: '#64748b' }}>AI-скор</span>
                            <span style={{ fontWeight: 700, fontSize: '13px', color: getScoreColor(c.aiScore) }}>{c.aiScore}%</span>
                          </div>
                          <div style={{ height: '4px', background: 'rgba(148, 163, 184, 0.1)', borderRadius: '2px', marginBottom: '8px' }}>
                            <div style={{ height: '100%', width: `${c.aiScore}%`, background: getScoreColor(c.aiScore), borderRadius: '2px' }} />
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>

              {activeScreen === 'candidates' && (

                  <div style={{ display: 'flex', gap: '10px', marginBottom: '16px', flexWrap: 'wrap' }}>
                    <Button primary icon={Plus}>Добавить</Button>
                    <Button icon={Upload}>Импорт резюме (Фича #04)</Button>
                    <Button icon={Filter}>Фильтры</Button>
                    <div style={{ flex: 1 }} />
                    <Button icon={Brain}>AI-матчинг (Фича #23)</Button>
                    <Button icon={RefreshCw}>Антидубликаты (Фича #32)</Button>
                  </div>

                  {/* Предупреждение о дубликате - Фича #32 */}

                    <AlertTriangle size={18} color="#f59e0b" />
                    <span style={{ flex: 1, fontSize: '12px' }}><strong style={{ color: '#f59e0b' }}>Фича #32:</strong> Найден дубликат — Александр Петров уже в базе (hh.ru, март 2024)</span>
                    <Button small>Объединить</Button>
                  </div>

                  {/* Верификация данных - Фича #21 */}

                    <CheckCircle size={18} color="#a78bfa" />
                    <span style={{ flex: 1, fontSize: '12px' }}><strong style={{ color: '#a78bfa' }}>Фича #21:</strong> Расхождение: в карточке опыт 5 лет, в переписке кандидат указал 3 года</span>
                    <Button small>Уточнить</Button>
                  </div>

                  <Section title="Все кандидаты" badge="156">
                    <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                      <thead>
                        <tr style={{ borderBottom: '1px solid rgba(148, 163, 184, 0.1)' }}>
                          {['Кандидат', 'AI-скор (#07)', 'Этап', 'SLA (#36)', 'Источник', 'Действия'].map(h => (
                            <th key={h} style={{ padding: '10px', textAlign: 'left', fontSize: '10px', fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {candidates.map(c => (
                          <tr key={c.id} style={{ borderBottom: '1px solid rgba(148, 163, 184, 0.05)' }}>
                            <td style={{ padding: '12px 10px' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                <div style={{ width: '32px', height: '32px', background: 'linear-gradient(135deg, #10b981, #6366f1)', borderRadius: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 600, fontSize: '11px' }}>{getInitials(c.name)}</div>

                              </div>
                            </td>
                            <td style={{ padding: '12px 10px' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>

                                <span style={{ fontWeight: 600, fontSize: '12px', color: getScoreColor(c.aiScore) }}>{c.aiScore}%</span>

                            </td>
                            <td style={{ padding: '12px 10px' }}>
                              <span style={{ background: 'rgba(99, 102, 241, 0.15)', color: '#818cf8', padding: '3px 8px', borderRadius: '4px', fontSize: '10px', fontWeight: 600 }}>{c.stage}</span>
                            </td>
                            <td style={{ padding: '12px 10px' }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>

                                <button style={{ width: '26px', height: '26px', background: 'rgba(239, 68, 68, 0.15)', border: 'none', borderRadius: '6px', color: '#ef4444', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ThumbsDown size={12} /></button>
                                <button style={{ width: '26px', height: '26px', background: 'rgba(99, 102, 241, 0.15)', border: 'none', borderRadius: '6px', color: '#6366f1', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><MessageSquare size={12} /></button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </Section>

                  {/* Фичи управляемости */}
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px' }}>

            {selectedCandidate && (

                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                  <h2 style={{ fontSize: '16px', fontWeight: 600 }}>Карточка кандидата</h2>

                      <h3 style={{ fontSize: '14px', fontWeight: 600, marginBottom: '4px' }}>{selectedCandidate.name}</h3>
                      <p style={{ color: '#64748b', fontSize: '12px', marginBottom: '6px' }}>{selectedCandidate.role}</p>
                      <div style={{ display: 'flex', gap: '4px' }}>
                        {selectedCandidate.tags.map((tag, i) => (
                          <span key={i} style={{ background: 'rgba(99, 102, 241, 0.15)', color: '#818cf8', padding: '2px 5px', borderRadius: '3px', fontSize: '9px', fontWeight: 600 }}>{tag}</span>
                        ))}
                      </div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: '12px', fontSize: '11px', color: '#64748b' }}>
                    <span><Briefcase size={12} style={{ marginRight: '4px' }} />{selectedCandidate.experience}</span>
                    <span><DollarSign size={12} style={{ marginRight: '4px' }} />{selectedCandidate.salary}</span>
                    <span><Target size={12} style={{ marginRight: '4px' }} />{selectedCandidate.source}</span>
                  </div>
                </div>

                {/* AI Score - Фича #07 */}
                <div style={{ background: 'linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(99, 102, 241, 0.15))', border: '1px solid rgba(16, 185, 129, 0.3)', borderRadius: '12px', padding: '14px', marginBottom: '14px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
                    <Brain size={16} color="#10b981" />
                    <span style={{ fontWeight: 600, fontSize: '12px' }}>AI-скоринг (#07)</span>
                    <span style={{ marginLeft: 'auto', fontSize: '20px', fontWeight: 700, color: getScoreColor(selectedCandidate.aiScore) }}>{selectedCandidate.aiScore}%</span>
                  </div>
                  <div style={{ height: '5px', background: 'rgba(148, 163, 184, 0.1)', borderRadius: '3px', marginBottom: '12px' }}>
                    <div style={{ height: '100%', width: `${selectedCandidate.aiScore}%`, background: getScoreColor(selectedCandidate.aiScore), borderRadius: '3px' }} />
                  </div>
                  <div style={{ fontSize: '11px', color: '#94a3b8', lineHeight: 1.6 }}>
                    <strong style={{ color: '#e2e8f0' }}>Почему:</strong>
                    <div style={{ marginTop: '4px' }}>✓ Опыт (+25%) ✓ Навыки (+30%) ✓ Зарплата (+20%) △ Нет enterprise (-6%)</div>
                  </div>
                </div>

                {/* AI Summary - Фича #06 */}
                <div style={{ background: 'rgba(30, 41, 59, 0.6)', borderRadius: '12px', padding: '14px', marginBottom: '14px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '10px' }}>
                    <Sparkles size={14} color="#8b5cf6" />
                    <span style={{ fontWeight: 600, fontSize: '12px' }}>AI-резюме (#06)</span>
                  </div>
                  <p style={{ fontSize: '11px', color: '#94a3b8', lineHeight: 1.6 }}>
                    Сильный кандидат с {selectedCandidate.experience} опыта. Специализация: {selectedCandidate.tags.join(', ')}.
                    <br /><strong style={{ color: '#10b981' }}>Плюсы:</strong> глубокие знания, менторинг.
                    <br /><strong style={{ color: '#f59e0b' }}>Риски:</strong> нет enterprise.
                  </p>
                </div>

                {/* История - Фича #33 */}
                <div style={{ background: 'rgba(30, 41, 59, 0.6)', borderRadius: '12px', padding: '14px', marginBottom: '14px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '10px' }}>
                    <History size={14} color="#6366f1" />
                    <span style={{ fontWeight: 600, fontSize: '12px' }}>История (#33)</span>
                  </div>
                  <div style={{ fontSize: '11px', color: '#94a3b8' }}>
                    📌 Первый контакт: март 2024<br />
                    💼 Вакансия: Frontend (отказ - бюджет)<br />
                    🔄 Повторное приглашение: январь 2025
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '8px' }}>
                  <button style={{ flex: 1, padding: '10px', background: '#10b981', border: 'none', borderRadius: '8px', color: '#fff', fontSize: '12px', fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px' }}><ThumbsUp size={14} /> Продвинуть</button>
                  <button style={{ flex: 1, padding: '10px', background: 'rgba(239, 68, 68, 0.15)', border: '1px solid rgba(239, 68, 68, 0.3)', borderRadius: '8px', color: '#ef4444', fontSize: '12px', fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px' }}><ThumbsDown size={14} /> Отклонить (#34)</button>
                </div>
              </div>
            )}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<CareerGoPlatform />);
    </script>
  </body>
